name: 🌐 Build for PWABuilder (No Pages Deploy)

# NOTE: GitHub Pages requires the repo to be Public OR GitHub Pro plan.
# This workflow only BUILDS the dist/ and uploads it as artifact.
# To get a live HTTPS URL for PWABuilder, either:
#   1. Make repo Public: Settings → Danger Zone → Change visibility → Public
#   2. OR use Cloudflare Pages / Netlify (free, supports private repos)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web App (dist artifact)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build production bundle
        run: |
          npx vite build
          echo "✅ Build complete — $(du -sh dist | cut -f1)"
          ls dist/

      - name: 📤 Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-4K-web-dist
          path: dist/
          retention-days: 14

      - name: 📊 Summary
        run: |
          echo "## 🌐 NOVA 4K ULTRA — Web Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ dist/ built and uploaded as artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To get HTTPS URL for PWABuilder:" >> $GITHUB_STEP_SUMMARY
          echo "**Option A**: Make repo Public → GitHub Pages activates automatically." >> $GITHUB_STEP_SUMMARY
          echo "**Option B**: Connect this repo to https://pages.cloudflare.com (free, works with private repos)." >> $GITHUB_STEP_SUMMARY
