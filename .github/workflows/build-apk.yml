name: 📦 Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: debug or release'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build-apk:
    name: Build NOVA 4K ULTRA APK
    runs-on: ubuntu-latest
    
    steps:
      # ─── 1. Checkout ────────────────────────────────────────────
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # ─── 2. Node.js ─────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # ─── 3. Build Web App ────────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build production bundle
        run: npm run build

      # ─── 4. Java ────────────────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─── 5. Android SDK ─────────────────────────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 Install Android SDK components
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      # ─── 6. Capacitor ────────────────────────────────────────────
      - name: 🔌 Install Capacitor packages
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: 🔧 Initialize Capacitor (if not already init)
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "NOVA 4K ULTRA" "com.nova.iptvpro" --web-dir=dist
          fi

      - name: ➕ Add Android platform
        run: npx cap add android || echo "Android platform already added"

      - name: 🔄 Sync web assets to Android
        run: npx cap sync android

      # ─── 7. Build APK ────────────────────────────────────────────
      - name: 🔨 Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 🚀 Build Release APK (unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      # ─── 8. Upload Artifacts ─────────────────────────────────────
      - name: 📤 Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-4K-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-4K-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # ─── 9. Build Summary ────────────────────────────────────────
      - name: 📊 Build Summary
        run: |
          echo "## 🎉 NOVA 4K ULTRA APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | NOVA 4K ULTRA |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | com.nova.iptvpro |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $(date '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download the APK from the Artifacts section below**" >> $GITHUB_STEP_SUMMARY
