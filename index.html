<!doctype html>
<html lang="ar" dir="rtl" class="h-full w-full bg-oled overflow-hidden select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="vp" />
    <script>
      // Smart TV (Tizen/webOS/LG/Android TV/TV Box) → force 1920x1080 TV viewport
      // Mobile / Touch devices → use responsive device viewport
      (function(){
        try {
          var userMode = localStorage.getItem('nova_ui_mode');
          if (userMode === 'tv') {
            document.documentElement.setAttribute('data-device', 'tv');
            var vp = document.getElementById('vp');
            if (vp) vp.content = 'width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
            return;
          } else if (userMode === 'mobile') {
            document.documentElement.setAttribute('data-device', 'mobile');
            return;
          }
        } catch(e) {}

        var ua = navigator.userAgent;
        var isTV = /Tizen|SmartTV|SMART-TV|webOS|NetCast|BRAVIA|Viera|HbbTV|Android TV|GoogleTV|LargeScreen|AFTB|AFTM|AFTT/i.test(ua);
        var hasTouch = 'ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

        // TV Box, STB, Smart TV, or PC without touchscreen is strictly TV
        if (!hasTouch) {
          isTV = true;
        }

        var vp = document.getElementById('vp');
        if (isTV && vp) {
          vp.content = 'width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
        } else if (vp) {
          vp.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no';
        }
        document.documentElement.setAttribute('data-device', isTV ? 'tv' : 'mobile');
      })();
    </script>
    <title>NOVA 4K ULTRA - Smart TV & Cinema OTT</title>

    <!-- PWA Manifest (required for PWABuilder & Android TWA packaging) -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOVA 4K" />
    <meta name="description" content="Smart IPTV Player - Live TV, Movies & Series in 4K Ultra HD" />
    
    <!-- Samsung Smart TV Webapis script (loaded automatically on Tizen TV) -->
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>

    <!-- Google Fonts: Cairo & Readex Pro for Arabic, Inter for Latin & Numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Service Worker Registration (PWA support) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body class="h-full w-full max-w-full m-0 p-0 bg-oled text-white font-sans overflow-x-hidden antialiased">
    <div id="root" class="h-full w-full max-w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
